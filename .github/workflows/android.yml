name: Android Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set API keys for build
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> local.properties
          echo "OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}" >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean, test & build debug APK
        run: ./gradlew clean testDebugUnitTest assembleDebug

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: movynex-arm64-debug-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Restore Cursed Crew release keystore
        if: github.event_name != 'pull_request'
        env:
          CURSED_CREW_KEYSTORE_BASE64: ${{ secrets.CURSED_CREW_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${RUNNER_TEMP}/movynex-signing"
          printf '%s' "${CURSED_CREW_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/movynex-signing/cursedcrew-release.p12"

      - name: Build signed Movynex release APK
        if: github.event_name != 'pull_request'
        env:
          MOVYNEX_KEYSTORE_PATH: ${{ runner.temp }}/movynex-signing/cursedcrew-release.p12
          MOVYNEX_KEYSTORE_PASSWORD: ${{ secrets.CURSED_CREW_KEYSTORE_PASSWORD }}
          MOVYNEX_KEY_ALIAS: ${{ secrets.CURSED_CREW_KEY_ALIAS }}
          MOVYNEX_KEY_PASSWORD: ${{ secrets.CURSED_CREW_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed Movynex ARM64 release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: movynex-arm64-release-apk
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
